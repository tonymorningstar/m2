<!DOCTYPE html>
<html xml:lang="en" lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Mario game written in HTML.</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script type="application/javascript" src="jquery-3.5.1.min.js"></script>
    <style type="text/css">
        :root {
            --gb-w: 785;
            --gb-h: 1280;
            --screen-left: 24.20%;
            --screen-top: 12.50%;
            --screen-width: 51.21%;
            --screen-height: 28.91%;
            --game-w: 400;
            --game-h: 300;
        }

        html, html > body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        *:not(a) {
            -moz-user-select: -moz-none;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        img {
            pointer-events: none;
        }

        #game-wrapper {
            position: relative;
            width: min(calc(100vw - 1rem), 393px);
            padding: 0.5rem;
            touch-action: none;
        }

        #settings-open {
            position: absolute;
            top: 0;
            right: 0.5rem;
            z-index: 100000;
            background: #4a4a6a;
            color: #fff;
            border: 2px solid #888;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
        }

        #settings-open:hover {
            background: #5a5a8a;
        }

        #settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 200000;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        #settings-overlay.hidden {
            display: none;
        }

        #settings-panel {
            background: #2d2d44;
            border: 3px solid #6c6c9c;
            border-radius: 12px;
            padding: 1.5em 2em;
            color: #eee;
            min-width: 280px;
            max-width: calc(100vw - 2rem);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            touch-action: manipulation;
        }

        #settings-panel h2 {
            margin: 0 0 1em 0;
            text-align: center;
            color: #ffd700;
            font-size: 18pt;
        }

        #settings-panel label {
            display: block;
            margin: 0.75em 0;
            font-size: 14px;
            cursor: pointer;
        }

        #settings-panel input[type="checkbox"] {
            margin-right: 0.5em;
            pointer-events: auto;
        }

        #settings-panel input[type="range"] {
            width: 100%;
            margin-top: 0.25em;
            pointer-events: auto;
        }

        .settings-row {
            margin: 0.75em 0;
        }

        .settings-row span {
            display: block;
            margin-bottom: 0.25em;
            font-size: 14px;
        }

        .settings-buttons {
            display: flex;
            gap: 0.5em;
            margin-top: 1.25em;
        }

        .settings-buttons button {
            flex: 1;
            padding: 0.6em;
            border: 2px solid #888;
            border-radius: 6px;
            background: #4a4a6a;
            color: #fff;
            cursor: pointer;
            pointer-events: auto;
            font-size: 13px;
        }

        .settings-buttons button:hover {
            background: #5a5a8a;
        }

        #gameboy-shell {
            position: relative;
            width: 100%;
            aspect-ratio: 785 / 1280;
            background: url(gameboy.png) no-repeat center top;
            background-size: 100% 100%;
            touch-action: none;
        }

        #game-screen {
            position: absolute;
            left: var(--screen-left);
            top: var(--screen-top);
            width: var(--screen-width);
            height: var(--screen-height);
            overflow: hidden;
            background: #2d5016;
        }

        #game-viewport {
            position: absolute;
            width: 400px;
            height: 300px;
            transform-origin: top left;
            will-change: transform;
        }

        .mario_big, .mario_small {
            position: absolute;
            left: 25px;
            top: 178px;
            z-index: 1000;
        }

        .mario_warping {
            z-index: unset;
        }

        .mario_big {
            width: 25px;
        }

        #stage {
            position: relative;
            width: 400px;
            height: 300px;
            margin: 0;
            background-color: #40bfff;
            background-size: contain;
            background-repeat: repeat-x;
            overflow: hidden;
            animation: bg_ani_1 20s infinite linear, bg_ani_2 2s infinite alternate;
            filter: saturate(0.6);
        }

        .scanlines {
            position: absolute;
            inset: 0;
            z-index: 999999999;
            opacity: 0.4;
            background-image: url(scanlines.png);
            background-size: cover;
            pointer-events: none;
        }

        .scanlines.hidden {
            display: none;
        }

        .info {
            padding: 2em !IMPORTANT;
            display: none;
        }

        #stats_pane {
            position: absolute;
            left: 0.5em;
            top: 0.3em;
            padding: 5px;
            font-size: 12pt;
            color: white;
            font-weight: bold;
            font-family: Arial;
            background-color: transparent;
            z-index: 200;
            text-shadow: 1px 1px 1px #000;
            pointer-events: none;
        }

        #stats_pane img {
            height: 0.7em;
        }

        .description {
            font-family: Arial;
            font-size: 9pt;
        }

        .points {
            color: white;
            font-size: 12pt;
            font-weight: bold;
            position: absolute;
        }

        #debug {
            border: 1px dashed blue;
            position: relative;
            width: 300px;
            height: 6em;
            overflow: hidden;
        }

        .sprite {
            display: none;
        }

        .hide {
            display: none;
        }

        .enemy {
            position: absolute;
            width: 32px;
            height: 32px;
            background-image: url(sprites.jpg);
            background-repeat: no-repeat;
            z-index: 500;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .enemy.dead {
            display: none;
        }

        #mobile-controls {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            touch-action: none;
        }

        #mobile-controls.hidden {
            display: none;
        }

        .touch-btn {
            position: absolute;
            margin: 0;
            padding: 0;
            background: transparent;
            border: none;
            outline: none;
            pointer-events: auto;
            cursor: pointer;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .touch-btn.pressed {
            background: rgba(255, 255, 255, 0.18);
        }

        .touch-btn.debug-visible {
            background: rgba(255, 0, 0, 0.12);
            outline: 1px dashed rgba(255, 255, 255, 0.25);
        }

        /* D-pad — centered on cross at ~21.5%, 61.2% */
        #btn-up    { left: 14.5%; top: 56.5%;  width: 14%; height: 7.5%; }
        #btn-down  { left: 14.5%; top: 64%;    width: 14%; height: 7.5%; }
        #btn-left  { left: 6%;    top: 58.5%;  width: 11%; height: 10%; }
        #btn-right { left: 23%;   top: 58.5%;  width: 11%; height: 10%; }

        /* A / B — from image analysis, expanded for touch */
        #btn-b { left: 64%; top: 59%; width: 16%; height: 8%; border-radius: 50%; }
        #btn-a { left: 78%; top: 57%; width: 14%; height: 8%; border-radius: 50%; }

        /* Start / Select */
        #btn-select { left: 34%; top: 66%; width: 17%; height: 6%; border-radius: 20%; }
        #btn-start  { left: 49%; top: 66%; width: 17%; height: 6%; border-radius: 20%; }

        #control-debug {
            margin-top: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: #111;
            color: #0f0;
            font-family: monospace;
            font-size: 13px;
            text-align: center;
            border: 1px solid #333;
            border-radius: 6px;
            min-height: 1.2em;
            width: 100%;
            box-sizing: border-box;
        }

        @keyframes bg_ani_1 {
            from {
                background-position-x: 0;
                background-position-y: 0;
            }
            to {
                background-position-x: -400px;
                background-position-y: 5px;
            }
        }

        @keyframes bg_ani_2 {
            from {
                background-position-y: 0;
            }
            to {
                background-position-y: 5px;
            }
        }

        @media (max-width: 420px) {
            #game-wrapper {
                width: 100vw;
                padding: 0.25rem;
            }

            #settings-open {
                font-size: 12px;
                padding: 6px 10px;
            }

            #control-debug {
                font-size: 11px;
            }
        }
    </style>
    <script type="text/javascript" src="gameengine.js"></script>
</head>
<body>

    <div id="game-wrapper">
        <button id="settings-open" type="button">&#9881; Settings</button>

        <div id="settings-overlay" class="hidden">
            <div id="settings-panel">
                <h2>Settings</h2>
                <label><input type="checkbox" id="setting-sound" checked> Sound Effects</label>
                <label><input type="checkbox" id="setting-music" checked> Background Music</label>
                <label><input type="checkbox" id="setting-mobile" checked> Mobile Controls</label>
                <label><input type="checkbox" id="setting-scanlines" checked> Scanlines Effect</label>
                <div class="settings-row">
                    <span>Game Speed: <strong id="speed-label">1.0x</strong></span>
                    <input type="range" id="setting-speed" min="0.5" max="2" step="0.1" value="1">
                </div>
                <div class="settings-buttons">
                    <button type="button" id="settings-reset">Reset</button>
                    <button type="button" id="settings-close">Close</button>
                </div>
            </div>
        </div>

        <div id="gameboy-shell">
            <div id="game-screen">
                <div id="game-viewport">
                    <div class="scanlines" id="scanlines"></div>
                    <div id="stats_pane">
                        <img id="stats_pane_coin" />x<span id="coin_counter">0</span>
                    </div>
                    <div id="stage">
                        <img id="sprite" class="mario_small" />
                        <input type="hidden" id="clouds" class="sprite" value="clouds.gif" />
                        <input type="hidden" id="running_left" class="sprite" value="running_left.gif" />
                        <input type="hidden" id="running_right" class="sprite" value="running_right.gif" />
                        <input type="hidden" id="jumping_left" class="sprite" value="running_left.gif" />
                        <input type="hidden" id="jumping_right" class="sprite" value="running_right.gif" />
                        <input type="hidden" id="standing_left" class="sprite" value="standing_left.gif" />
                        <input type="hidden" id="standing_right" class="sprite" value="standing_right.gif" />
                        <input type="hidden" id="ground_brick" class="sprite" value="ground_brick.png" />
                        <input type="hidden" id="ground_pipe" class="sprite" value="ground_pipe.gif" />
                        <input type="hidden" id="question_block" class="sprite" value="question_block.gif" />
                        <input type="hidden" id="block_brick" class="sprite" value="block_brick.gif" />
                        <input type="hidden" id="moving_block" class="sprite" value="moving_block.png" />
                        <input type="hidden" id="mushroom_head" class="sprite" value="mushroom_head.gif" />
                        <input type="hidden" id="coin" class="sprite" value="coin.gif" />
                        <input type="hidden" id="small_brick" class="sprite" value="small_brick.png" />
                        <input type="hidden" id="bush" class="sprite" value="bush.png" />
                        <input type="hidden" id="sprites_sheet" class="sprite" value="sprites.jpg" />
                    </div>
                </div>
            </div>

            <div id="mobile-controls">
                <button class="touch-btn" id="btn-up" type="button" aria-label="D-pad Up"></button>
                <button class="touch-btn" id="btn-down" type="button" aria-label="D-pad Down"></button>
                <button class="touch-btn" id="btn-left" type="button" aria-label="D-pad Left"></button>
                <button class="touch-btn" id="btn-right" type="button" aria-label="D-pad Right"></button>
                <button class="touch-btn" id="btn-b" type="button" aria-label="B Button"></button>
                <button class="touch-btn" id="btn-a" type="button" aria-label="A Button"></button>
                <button class="touch-btn" id="btn-select" type="button" aria-label="Select"></button>
                <button class="touch-btn" id="btn-start" type="button" aria-label="Start"></button>
            </div>
        </div>

        <div id="control-debug">Pressed: (none)</div>
    </div>

    <div class="info">
        <div class="description">
            <p>How to play:</p>
            <ul>
                <li>Arrow Keys to move</li>
                <li>or WASD to move</li>
                <li>or Space to jump</li>
                <li>Stomp enemies from above</li>
                <li>Go down last pipe to restart level</li>
            </ul>
        </div>
        <textarea id="debug" rows="3" cols="50"></textarea>
    </div>

    <audio id="audio_jump"><source src="jump.wav" type="audio/wav"></audio>
    <audio id="audio_mushroom"><source src="mushroom.wav" type="audio/wav"></audio>
    <audio id="audio_powerup"><source src="powerup.wav" type="audio/wav"></audio>
    <audio id="audio_bump"><source src="bump.wav" type="audio/wav"></audio>
    <audio id="audio_died"><source src="died.wav" type="audio/wav"></audio>
    <audio id="audio_coin"><source src="coin.wav" type="audio/wav"></audio>
    <audio id="audio_coin2"><source src="coin.wav" type="audio/wav"></audio>
    <audio id="audio_coin3"><source src="coin.wav" type="audio/wav"></audio>
    <audio id="audio_coin4"><source src="coin.wav" type="audio/wav"></audio>
    <audio id="audio_pipe"><source src="pipe.wav" type="audio/wav"></audio>
    <audio id="audio_overworld"><source src="overworld.mp3" type="audio/mp3"></audio>

</body>
</html>
